# Determinism guard. Transcendental functions must come from the pure-Rust `libm` crate (through
# `crate::math`), never from the platform's C library, so native builds and the wasm32 artifact
# compute bit-identical results. `powi` and `mul_add` are refused too: their results depend on
# the target. Ambient clocks are refused outright.
disallowed-methods = [
  { path = "f64::sin", reason = "use crate::math::sin (libm): cross-target determinism" },
  { path = "f64::cos", reason = "use crate::math::cos (libm): cross-target determinism" },
  { path = "f64::tan", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::asin", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::acos", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::atan", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::atan2", reason = "use crate::math::atan2 (libm): cross-target determinism" },
  { path = "f64::exp", reason = "use crate::math::exp (libm): cross-target determinism" },
  { path = "f64::exp2", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::exp_m1", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::ln", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::log", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::log2", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::log10", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::ln_1p", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::powf", reason = "use crate::math::pow (libm): cross-target determinism" },
  { path = "f64::powi", reason = "target-dependent result: multiply explicitly" },
  { path = "f64::sqrt", reason = "use crate::math::sqrt (libm): one arithmetic path" },
  { path = "f64::cbrt", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::hypot", reason = "use crate::math::sqrt on explicit squares" },
  { path = "f64::sinh", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::cosh", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::tanh", reason = "use libm through crate::math: cross-target determinism" },
  { path = "f64::mul_add", reason = "fused multiply-add: keep every operation separately rounded" },
  { path = "std::time::Instant::now", reason = "the engine never reads a clock" },
  { path = "std::time::SystemTime::now", reason = "the engine never reads a clock" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is not deterministic" },
  { path = "std::collections::HashSet", reason = "iteration order is not deterministic" },
]

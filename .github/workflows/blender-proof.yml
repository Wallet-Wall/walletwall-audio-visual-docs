name: Blender proof

# The Blender lane's determinism proof (docs/BLENDER.md, Determinism) on a hosted runner: the pinned official
# Blender build, CPU software GL (Mesa llvmpipe, the approved proof class), and the representative proof set
# (src/blender/proof-set.ts: idle, crouch, airborne, landing, perch, inspect, tail brace, and the transition's entry,
# peak, and exit).
#   A. same class: two fresh runs on this runner must give byte-identical frames;
#   B. cross class: this runner's frames against the production class's committed reference
#      (blender/proof/reference/) must hold the pinned tolerance (config/blender-environments.json).
# The full-lesson render stays on the production render host (it would take hours on software GL).
# Manual only; read-only and credential-free like every workflow here.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-proof:
    name: Blender proof (same-class bytes, cross-class tolerance)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Explicit bash runs with -o pipefail, so a failed comparison piped through tee still fails the step.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chrome Headless Shell (the version @remotion/renderer pins; it draws the reveal's teaching surfaces)
        run: npx remotion browser ensure

      - name: Runtime libraries for headless Blender with software GL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsm6 libice6 libgl1-mesa-dri libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0

      - name: Install the pinned Blender build (verified against config/blender.json)
        run: |
          version=$(node -p "require('./config/blender.json').blender.version")
          series=$(echo "$version" | cut -d. -f1,2)
          file="blender-${version}-linux-x64.tar.xz"
          want=$(node -p "require('./config/blender.json').blender.artifacts['${file}']")
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" "https://mirrors.ocf.berkeley.edu/blender/release/Blender${series}/${file}"
          echo "${want}  $RUNNER_TEMP/$file" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "WALLETWALL_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Build WalletWallaby (the canonical model hash must equal the reference's)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npm run blender:build
          node -e "const m=require('./dist/blender/out/character/model.json'), r=require('./blender/proof/reference/proof.json'); if (m.modelSha256 !== r.canonicalModelSha256) { console.error('canonical model', m.modelSha256, 'is not the reference', r.canonicalModelSha256); process.exit(1) }"

      - name: Proof set, run A and run B (fresh processes)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npm run blender:proof -- render --run=ci-a
          npm run blender:proof -- render --run=ci-b

      # The rig invariants Rive used to prove, on a sample of the frames Blender renders (the production host runs the
      # full stride before every publication render: npm run publication:proof). Coverage minimums scale with the stride.
      - name: Ported rig invariants (a sample)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          npm run blender:invariants -- --every=270 --lab-every=6
          node -e "const r=require('./dist/blender/out/invariants/report.json'); console.log(JSON.stringify({ pass: r.pass, counts: r.counts, palette: r.palette, failuresByCheck: r.failuresByCheck }, null, 2))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: A. same class, byte-identical
        run: npm run blender:proof -- compare ci-a ci-b | tee -a "$GITHUB_STEP_SUMMARY"

      - name: B. cross class, against the production reference, within the pinned tolerance
        run: npm run blender:proof -- compare ci-a reference | tee -a "$GITHUB_STEP_SUMMARY"

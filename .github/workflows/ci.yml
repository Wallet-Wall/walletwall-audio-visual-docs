name: CI

# Verifies the audiovisual docs pipeline: types, tests, byte-for-byte spec and
# Rive rig regeneration, publishability validation, contract integrity, and a
# dependency audit; and the Rust/WASM Motion Intelligence engine: format, lint,
# tests, and a byte-for-byte rebuild of its committed WebAssembly artifact.
# Read-only and credential-free by design: it never renders with a live voice,
# never contacts YouTube, and is safe on fork PRs.
# Canonical reads come from the blob-verified fixture mirror; live staleness
# and brand-drift checks need a WalletWall checkout (WALLETWALL_SOURCE_ROOT).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Committed specs regenerate byte-for-byte
        run: npm run plan:check

      - name: Committed Rive rig regenerates byte-for-byte
        run: npm run rive:check

      - name: Validate specs
        run: npm run validate

      - name: Contracts and fixture mirror
        run: npm run contracts:check

      - name: Freshness report (informational)
        run: |
          set +e
          node scripts/freshness.ts | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          if [ "$code" = "2" ]; then echo "::warning::A video needs re-rendering or a new revision (see summary)."; exit 0; fi
          exit "$code"

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  motion-intelligence:
    name: Motion Intelligence (Rust/WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Rust toolchain (pinned by motion-intelligence/rust-toolchain.toml)
        working-directory: motion-intelligence
        run: |
          rustup toolchain install
          rustc --version

      - name: Format
        working-directory: motion-intelligence
        run: cargo fmt --check

      - name: Clippy (native and wasm32, warnings are errors)
        working-directory: motion-intelligence
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Test (native engine against the canonical fixture)
        working-directory: motion-intelligence
        run: cargo test --locked

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Committed WASM artifact regenerates byte-for-byte
        run: npm run motion:check

      - name: TypeScript integration tests (TS -> WASM -> TS)
        run: node --test test/rust-motion-engine.test.ts
